<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>DadoBruto — Autorizado</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 60px auto; padding: 0 20px; color: #222; }
  .ok { color: #2e7d32; }
  code { background: #f2f2f2; padding: 10px; display: block; word-break: break-all; border-radius: 6px; margin-top: 10px; }
</style>
</head>
<body>
<h1 class="ok">Autorizado com sucesso</h1>
<p>A conta foi conectada ao aplicativo DadoBruto. Você já pode fechar esta aba.</p>
<div id="code-box" style="display:none">
  <p>Código de autorização (uso interno):</p>
  <code id="code"></code>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  if (code) {
    document.getElementById("code").textContent = code;
    document.getElementById("code-box").style.display = "block";
  }
</script>
</body>
</html>
